<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8b5cf6" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#27272a" />
      <stop offset="100%" stop-color="#18181b" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Outer Gradient Shield (Security/Competition) -->
  <path d="M 50 5 L 90 20 L 90 50 C 90 75 50 95 50 95 C 50 95 10 75 10 50 L 10 20 Z" fill="url(#primaryGrad)" />

  <!-- Inner Dark Shield -->
  <path d="M 50 11 L 84 24 L 84 49 C 84 70 50 88 50 88 C 50 88 16 70 16 49 L 16 24 Z" fill="url(#shieldGrad)" />
  
  <!-- Minimalist Trophy (Victory/Esports) -->
  <path d="M 35 25 L 65 25 L 60 55 C 58 65, 42 65, 40 55 Z" fill="none" stroke="url(#primaryGrad)" stroke-width="4" stroke-linejoin="round"/>
  <path d="M 50 60 L 50 75 M 40 75 L 60 75" stroke="url(#primaryGrad)" stroke-width="4" stroke-linecap="round" />

  <!-- Gamepad over the trophy (Gaming) -->
  <rect x="25" y="40" width="50" height="25" rx="12.5" fill="#ffffff" filter="url(#glow)"/>
  
  <!-- D-Pad (Left) -->
  <rect x="33" y="50" width="10" height="3" fill="#18181b" rx="1"/>
  <rect x="36.5" y="46.5" width="3" height="10" fill="#18181b" rx="1"/>

  <!-- Action Buttons (Right) -->
  <circle cx="63" cy="48" r="2.5" fill="#8b5cf6" />
  <circle cx="58" cy="53" r="2.5" fill="#06b6d4" />
  <circle cx="68" cy="53" r="2.5" fill="#06b6d4" />
  <circle cx="63" cy="58" r="2.5" fill="#8b5cf6" />
</svg>
